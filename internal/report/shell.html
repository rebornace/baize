<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__BAIZE_TITLE__</title>
<style>
:root {
  --font: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --bg: #f0f4f8;
  --bg-accent: radial-gradient(1200px 480px at 10% -10%, rgba(59, 102, 245, 0.14), transparent 55%),
    radial-gradient(900px 400px at 90% 0%, rgba(34, 197, 94, 0.1), transparent 50%),
    var(--bg);
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --text: #0f172a;
  --muted: #64748b;
  --border: #e2e8f0;
  --accent: #3b66f5;
  --accent-soft: rgba(59, 102, 245, 0.1);
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06);
  --radius: 14px;
  --radius-sm: 10px;
}
[data-theme="dark"] {
  --bg: #0b1220;
  --bg-accent: radial-gradient(1200px 480px at 10% -10%, rgba(59, 102, 245, 0.18), transparent 55%),
    radial-gradient(900px 400px at 90% 0%, rgba(34, 197, 94, 0.08), transparent 50%),
    var(--bg);
  --surface: #111827;
  --surface-2: #1e293b;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --border: #334155;
  --accent: #60a5fa;
  --accent-soft: rgba(96, 165, 250, 0.12);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 12px 32px rgba(0, 0, 0, 0.35);
}
* { box-sizing: border-box; }
body {
  font-family: var(--font);
  margin: 0;
  color: var(--text);
  background: var(--bg-accent);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.baize-page {
  max-width: 1120px;
  margin: 0 auto;
  padding: 1.25rem 1.25rem 2rem;
}
.baize-header {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1.25rem;
}
.baize-header h1 {
  margin: 0;
  font-size: 1.65rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.2;
}
.baize-header-sub {
  margin: 0.35rem 0 0;
  font-size: 0.88rem;
  color: var(--muted);
}
.baize-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 1rem;
}
#filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.65rem;
  flex: 1;
}
#export-pdf {
  padding: 0.5rem 1rem;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--text);
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: background 0.15s, border-color 0.15s;
}
#export-pdf:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
}
#sections {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.baize-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.1rem 1.25rem;
  box-shadow: var(--shadow);
}
.baize-section[data-section-type="markdown"] {
  background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
}
.baize-section[data-section-type="markdown"] .markdown-body h2 {
  margin-top: 0;
  font-size: 1.1rem;
  font-weight: 600;
}
.baize-section[data-section-type="markdown"] .markdown-body p {
  margin: 0.35rem 0;
  color: var(--muted);
}
@media print {
  #filter-bar, #export-pdf { display: none !important; }
  body { background: #fff; }
  .baize-section { break-inside: avoid; border: none; box-shadow: none; }
}
</style>
</head>
<body>
<div class="baize-page">
  <header class="baize-header">
    <div>
      <h1>__BAIZE_TITLE__</h1>
      <p class="baize-header-sub">Baize 数据分析 · 支持筛选、下钻与导出</p>
    </div>
  </header>
  <div class="baize-toolbar">
    <div id="filter-bar"></div>
    <button id="export-pdf" type="button">导出 PDF</button>
  </div>
  <div id="sections">
__BAIZE_SECTIONS__
  </div>
</div>
<script>window.__BAIZE_PAGE__=__BAIZE_PAGE_JSON__;</script>
<script>__BAIZE_ECHARTS_JS__</script>
<script>__BAIZE_RUNTIME_JS__</script>
<script>BaizeReport.init(window.__BAIZE_PAGE__);</script>
</body>
</html>
