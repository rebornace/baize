# Copy into a local configs/*.local.yaml (gitignored) — never commit real tokens.
# Terminal / code-exec lives in an external MCP sandbox, not in baize core.
#
# HTTP transport (remote sandbox):
connector:
  id: sandbox-mcp
  type: mcp
  require_approval_mutating: true
  mcp:
    transport: http
    url: "${SANDBOX_MCP_URL}"           # e.g. https://sandbox.example/mcp
    headers:
      Authorization: "Bearer ${SANDBOX_TOKEN}"

# Stdio transport (local process) — alternative shape:
# connector:
#   id: sandbox-stdio
#   type: mcp
#   require_approval_mutating: true
#   mcp:
#     transport: stdio
#     command: your-sandbox-mcp
#     args: ["--root", "/tmp/baize-sandbox"]
