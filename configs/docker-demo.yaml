# 容器试用栈：配合 docker-compose.demo.yml（Runtime + mock-ticket）。
listen: ":8080"
store:
  driver: sqlite
  sqlite_path: /app/data/baize.db
ui:
  enabled: true
control_plane:
  operator_token: ""
  admin_token: ""
llm:
  provider: mock
skills:
  builtin_dir: /app/skills
  user_dir: /app/data/skills
agent:
  id: ticket-agent
  system: "你是企业工单助手，只能通过工具访问工单系统。"
  skills:
    - data-analytics
    - ticket-triage
connector:
  id: ticket-api
  type: openapi
  spec: examples/mock-ticket/openapi.yaml
  base_url: http://mock-ticket:18080
  require_approval:
    - create_ticket
    - update_ticket_status
  auth:
    mode: static
    capture:
      tool_name_glob: "*login*"
      token_json_paths: ["accessToken", "data.accessToken", "data.token"]
      label_json_paths: ["email", "data.email"]
      header_template: "Bearer {{token}}"
      default_scheme: ""
run:
  max_steps: 16
conversation:
  max_messages: 40
  persist_identities: true
mock_ticket:
  listen: off
