listen: ":8080"
store:
  driver: sqlite
  sqlite_path: ./data/baize.db
ui:
  enabled: true
llm:
  provider: mock
  # 真实 LLM：复制为 configs/demo.local.yaml（gitignore）并设 .env 中 BAIZE_API_KEY
  # provider: openai_compatible
  # base_url: https://api.deepseek.com
  # model: deepseek-v4-flash
  # disable_thinking: true
  # api_key_env: BAIZE_API_KEY
agent:
  id: ticket-agent
  system: "你是企业工单助手，只能通过工具访问工单系统。"
connector:
  id: ticket-api
  type: openapi
  spec: examples/mock-ticket/openapi.yaml
  base_url: http://127.0.0.1:18080
  require_approval:
    - create_ticket
run:
  max_steps: 8
demo:
  ticket_listen: ":18080"
