# 生产默认：baize start。无演示 Connector；须 export BAIZE_API_KEY。
# 覆盖：复制为 configs/minimal.local.yaml（gitignore）后改 llm.base_url / model 等。
listen: ":8080"
# runtime:
#   public_base_url: "https://baize.example:8080"  # 空则不向侧车注入 callback_urls
#   callback_hmac_secret: ""                       # 空则启动时生成 ephemeral 密钥
#   callback_token_ttl_sec: 3600
store:
  driver: sqlite
  sqlite_path: ./data/baize.db
ui:
  enabled: true
control_plane:
  operator_token: ""   # 生产建议 env:BAIZE_OPERATOR_TOKEN / env:BAIZE_ADMIN_TOKEN
  admin_token: ""
llm:
  provider: openai_compatible
  base_url: https://api.deepseek.com
  model: deepseek-chat
  disable_thinking: true
  # supports_vision: false   # default; set true for vision-capable models (e.g. gpt-4o)
  api_key_env: BAIZE_API_KEY
skills:
  # 核心内置 Skill（minimal 仅扫描此目录）
  builtin_dir: ./skills
  user_dir: ./data/skills
agent:
  id: default-agent
  system: "你是企业助手。仅通过已注册工具访问后端系统；无工具时说明如何配置 Connector。"
  skills:
    - data-analytics
run:
  max_steps: 16
events:
  webhook:
    url: ""
    headers: {}
conversation:
  max_messages: 40
  persist_identities: true
# 对象存储：分析报告产物 HTML 字节存放位置。
# driver: file（默认，本地磁盘 <dataDir>/artifacts）| s3（AWS S3/MinIO/OSS/COS 兼容）
# storage:
#   driver: file
#   file:
#     root_dir: ""          # 留空则用 dataDir
#   s3:
#     endpoint: "minio.local:9000"
#     region: ""
#     bucket: "baize"
#     prefix: "baize"
#     access_key_env: S3_ACCESS_KEY   # 密钥仅从环境变量读取
#     secret_key_env: S3_SECRET_KEY
#     use_ssl: false
#     path_style: true                # MinIO/自建设 true；AWS 设 false
#     auto_create_bucket: false
mock_ticket:
  listen: off
inbox:
  channels: []
# 渠道声明式启用（可选）。整段省略时装配全部已注册渠道（含内置默认 weixin），
# 与历史默认部署完全等价。列出后：仅 enabled:true 的渠道被装配；未列出的内置
# 默认渠道（weixin）仍装配以保持兼容；显式 enabled:false 始终生效（可关闭默认渠道）。
# channels:
#   - type: weixin
#     enabled: true
#     config:
#       creds_dir: ./data/channels/weixin   # 覆盖默认凭据/设置目录
#       # base_url: http://127.0.0.1:9002    # 渠道特定不透明配置
#
# 进程外 IM 渠道（webhook 适配器）。一个实例 = 一个 IM 账号；多账号写多条。
# channels:
#   - name: feishu            # 实例名（缺省=type）；同 type 多实例时必填且唯一
#     type: webhook
#     enabled: true
#     config:
#       source: feishu        # convID 前缀/meta.Source；缺省=实例名，需唯一
#       account: feishu-bot   # IM 账号标识；缺省=实例名
#       secret: ""            # 入站验签 HMAC 密钥（必填）
#       outbound_url: ""      # 适配器出站接收地址（必填）
#       outbound_secret: ""   # 出站签名密钥（缺省=secret）
#       assignee: ""          # 会话归属操作员（必填）
#       agent_id: ""          # 指定 agent（缺省用默认 agent）
#       supports_vision: "false"
#       allowlist: ""         # 逗号分隔；配置后强制入站白名单
