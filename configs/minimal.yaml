# 生产默认：baize start。无演示 Connector；须 export BAIZE_API_KEY。
# 覆盖：复制为 configs/minimal.local.yaml（gitignore）后改 llm.base_url / model 等。
listen: ":8080"
# runtime:
#   public_base_url: "https://baize.example:8080"  # 空则不向侧车注入 callback_urls
#   callback_hmac_secret: ""                       # 空则启动时生成 ephemeral 密钥
#   callback_token_ttl_sec: 3600
store:
  driver: sqlite
  sqlite_path: ./data/baize.db
ui:
  enabled: true
control_plane:
  operator_token: ""   # 生产建议 env:BAIZE_OPERATOR_TOKEN / env:BAIZE_ADMIN_TOKEN
  admin_token: ""
llm:
  provider: openai_compatible
  base_url: https://api.deepseek.com
  model: deepseek-chat
  disable_thinking: true
  # supports_vision: false   # default; set true for vision-capable models (e.g. gpt-4o)
  api_key_env: BAIZE_API_KEY
skills:
  # 核心内置 Skill（minimal 仅扫描此目录）
  builtin_dir: ./skills
  user_dir: ./data/skills
agent:
  id: default-agent
  system: "你是企业助手。仅通过已注册工具访问后端系统；无工具时说明如何配置 Connector。"
  skills:
    - data-analytics
run:
  max_steps: 16
events:
  webhook:
    url: ""
    headers: {}
conversation:
  max_messages: 40
  persist_identities: true
# 对象存储：分析报告产物 HTML 字节存放位置。
# driver: file（默认，本地磁盘 <dataDir>/artifacts）| s3（AWS S3/MinIO/OSS/COS 兼容）
# storage:
#   driver: file
#   file:
#     root_dir: ""          # 留空则用 dataDir
#   s3:
#     endpoint: "minio.local:9000"
#     region: ""
#     bucket: "baize"
#     prefix: "baize"
#     access_key_env: S3_ACCESS_KEY   # 密钥仅从环境变量读取
#     secret_key_env: S3_SECRET_KEY
#     use_ssl: false
#     path_style: true                # MinIO/自建设 true；AWS 设 false
#     auto_create_bucket: false
mock_ticket:
  listen: off
inbox:
  channels: []
# 渠道声明式启用。微信已迁移为「进程外 webhook 适配器」：baize 通过子进程
# 托管 weixin-adapter（需先构建：go build -o bin/weixin-adapter ./cmd/weixin-adapter，
# Windows 为 bin/weixin-adapter.exe）。下列块默认启用微信：secret 留空时 baize 自动
# 生成 HMAC 并经 -secret 注入适配器；适配器监听 127.0.0.1:8090，入站回推 baize:8080。
channels:
  - name: weixin
    type: webhook
    enabled: true
    config:
      source: weixin
      # secret 留空：adapter_autostart=true 时 baize 生成随机 HMAC 并经 -secret 注入
      outbound_url: http://127.0.0.1:8090/outbound
      admin_url: http://127.0.0.1:8090
      assignee: channel:weixin
      supports_vision: "true"
      adapter_autostart: "true"
      adapter_command: weixin-adapter
      adapter_args: "-addr=127.0.0.1:8090,-creds=./data/channels/weixin"
      adapter_creds_dir: ./data/channels/weixin
      # allowlist 留空 = 放行全部私信；creds 复用 ./data/channels/weixin/creds.json 免重扫
      # baize 监听非 :8080 时，显式指定适配器回推入站地址：
      # adapter_baize_url: http://127.0.0.1:<port>
#
# 其它 IM（飞书/钉钉等）用同一 webhook 机制独立部署适配器。一个实例 = 一个 IM 账号；
# 多账号写多条。适配器独立部署（不由 baize 托管）时省略 adapter_*、自行填 secret：
#   - name: feishu            # 实例名（缺省=type）；同 type 多实例时必填且唯一
#     type: webhook
#     enabled: true
#     config:
#       source: feishu        # convID 前缀/meta.Source；缺省=实例名，需唯一
#       account: feishu-bot   # IM 账号标识；缺省=实例名
#       secret: ""            # 入站验签 HMAC 密钥（独立部署必填）
#       outbound_url: ""      # 适配器出站接收地址（必填）
#       outbound_secret: ""   # 出站签名密钥（缺省=secret）
#       assignee: ""          # 会话归属操作员（必填）
#       agent_id: ""          # 指定 agent（缺省用默认 agent）
#       supports_vision: "false"
#       allowlist: ""         # 逗号分隔；配置后强制入站白名单
