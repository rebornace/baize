# 容器生产默认：仅 Baize Runtime，无演示 Connector。
listen: ":8080"
store:
  driver: sqlite
  sqlite_path: /app/data/baize.db
ui:
  enabled: true
control_plane:
  operator_token: ""
  admin_token: ""
llm:
  provider: openai_compatible
  base_url: https://api.deepseek.com
  model: deepseek-chat
  disable_thinking: true
  api_key_env: BAIZE_API_KEY
skills:
  builtin_dir: ""
  user_dir: /app/data/skills
agent:
  id: default-agent
  system: "你是企业助手。仅通过已注册工具访问后端系统；无工具时说明如何配置 Connector。"
  skills: []
run:
  max_steps: 16
conversation:
  max_messages: 40
  persist_identities: true
mock_ticket:
  listen: off
