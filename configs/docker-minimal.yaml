# 容器生产默认：仅 Baize Runtime，无演示 Connector。
listen: ":8080"
# runtime:
#   public_base_url: "http://baize:8080"  # address reachable by sidecars; empty => no injection
#   callback_hmac_secret: ""
#   callback_token_ttl_sec: 3600
store:
  driver: sqlite
  sqlite_path: /app/data/baize.db
ui:
  enabled: true
control_plane:
  operator_token: ""
  admin_token: ""
llm:
  provider: openai_compatible
  base_url: https://api.deepseek.com
  model: deepseek-chat
  disable_thinking: true
  # supports_vision: false   # default; set true for vision-capable models (e.g. gpt-4o)
  api_key_env: BAIZE_API_KEY
skills:
  builtin_dir: /app/skills
  user_dir: /app/data/skills
agent:
  id: default-agent
  system: "你是白泽（Baize）上的企业助手。业务请求只通过已注册工具访问后端系统；用户问白泽怎么用、怎么配、架构或设置在哪时，按 baize-help 技能如实说明并指向操作台对应页，不要编造未出现在技能、工具列表或本对话中的能力。无工具时说明如何在设置里配置连接器。"
  skills:
    - baize-help
    - data-analytics
run:
  max_steps: 16
conversation:
  max_messages: 40
  persist_identities: true
storage:
  driver: file
