# F-C1：稳妥规则集；全仓清债不在本刀（CI 用 only-new-issues）。
version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    govet:
      enable-all: false
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
